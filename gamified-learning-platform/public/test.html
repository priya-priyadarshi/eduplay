<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Question Generator</title>

    <style>

        body{
            font-family: Arial;
            padding: 30px;
        }

        button{
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        pre{
            background: #f4f4f4;
            padding: 20px;
            margin-top: 20px;
            white-space: pre-wrap;
        }

    </style>
</head>

<body>

    <h1>AI Question Generator</h1>

    <button onclick="generateQuestions()">
        Generate Questions
    </button>

    <pre id="output"></pre>

    <script>

        async function generateQuestions() {

            document.getElementById("output").innerHTML =
                "Generating Questions...";

            const response = await fetch(
                "http://localhost:5000/api/ai/generate-questions",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        degree: "BTech",
                        branch: "CSE",
                        semester: "3",
                        subject: "Programming Fundamentals",
                        topic: "Loops",
                        level: "Basic"

                    })
                }
            );

            const data = await response.json();

            document.getElementById("output").innerHTML =
                data.questions;
        }

    </script>

</body>
</html>
